<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>THE HIDDEN ARCHIVE</title>


<!-- GOOGLE FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Cinzel+Decorative:wght@400;700;900&family=Orbitron:wght@400;500;700;900&display=swap"
rel="stylesheet">


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}

body{

    background:#020303;

    color:#ddd;

    font-family:'Orbitron',monospace;

    position:relative;

}


/* =========================
   DARK BACKGROUND
========================= */

body{

    background:

    radial-gradient(
        circle at 50% 42%,
        rgba(0,255,150,.13) 0%,
        rgba(0,150,255,.08) 25%,
        transparent 48%
    ),

    radial-gradient(
        circle at 15% 75%,
        rgba(0,120,90,.14) 0%,
        transparent 38%
    ),

    radial-gradient(
        circle at 85% 20%,
        rgba(0,90,180,.12) 0%,
        transparent 35%
    ),

    radial-gradient(
        circle at center,
        #08110f 0%,
        #040807 35%,
        #020303 65%,
        #000 100%
    );

}


/* =========================
   MOVING FOG
========================= */

.fog{

    position:fixed;

    width:120vw;
    height:120vh;

    left:-10vw;
    top:-10vh;

    background:

    radial-gradient(
        ellipse at center,
        rgba(90,100,100,.08),
        transparent 55%
    );

    filter:blur(35px);

    animation:
    fogMove 14s
    infinite alternate
    ease-in-out;

    pointer-events:none;

    z-index:1;

}


@keyframes fogMove{

    0%{

        transform:
        translate(-5%,-3%)
        scale(1);

    }

    50%{

        transform:
        translate(4%,2%)
        scale(1.1);

    }

    100%{

        transform:
        translate(-2%,6%)
        scale(1.2);

    }

}


/* =========================
   PARTICLES
========================= */

#particles{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:2;

}


/* =========================
   SCANLINES
========================= */

.scanlines{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:8;

    background:

    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.018) 0px,
        rgba(255,255,255,.018) 1px,
        transparent 1px,
        transparent 5px
    );

}


/* =========================
   VIGNETTE
========================= */

.vignette{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:7;

    background:

    radial-gradient(
        circle,
        transparent 35%,
        rgba(0,0,0,.45) 70%,
        rgba(0,0,0,.95) 100%
    );

}


/* =========================
   MAIN
========================= */

.main{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    z-index:5;

}


/* =========================
   CONTENT
========================= */

.content{

    width:92%;

    max-width:1000px;

    animation:
    intro 3s ease
    forwards;

}


@keyframes intro{

    from{

        opacity:0;

        transform:
        translateY(30px)
        scale(.96);

        filter:blur(12px);

    }

    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

        filter:blur(0);

    }

}


/* =========================
   TOP SECRET
========================= */

.top-secret{

    font-family:'Orbitron',monospace;

    font-size:9px;

    letter-spacing:5px;

    color:#555;

    margin-bottom:28px;

    animation:
    blink 4s infinite;

}


@keyframes blink{

    0%,90%,100%{
        opacity:1;
    }

    93%{
        opacity:.2;
    }

}


/* =========================
   MAIN TITLE
========================= */

.title{

    font-family:
    'Cinzel Decorative',
    serif;

    font-size:

    clamp(
        35px,
        8vw,
        100px
    );

    font-weight:900;

    letter-spacing:

    clamp(
        3px,
        1vw,
        12px
    );

    color:#e6e6e6;

    text-transform:uppercase;

    position:relative;

    text-shadow:

    0 0 5px
    rgba(255,255,255,.4),

    0 0 25px
    rgba(150,170,170,.18),

    0 0 70px
    rgba(100,120,120,.08);

}


/* =========================
   TITLE GLITCH
========================= */

.title::before,
.title::after{

    content:
    "THE HIDDEN ARCHIVE";

    position:absolute;

    left:0;

    width:100%;

    opacity:0;

}


.title::before{

    color:#777;

    animation:
    glitch1 5s infinite;

}


.title::after{

    color:#444;

    animation:
    glitch2 5s infinite;

}


@keyframes glitch1{

    0%,94%,100%{

        opacity:0;

        transform:none;

    }

    95%{

        opacity:.8;

        transform:
        translate(-3px,1px);

    }

    96%{

        opacity:0;

    }

}


@keyframes glitch2{

    0%,91%,100%{

        opacity:0;

        transform:none;

    }

    92%{

        opacity:.6;

        transform:
        translate(4px,-2px);

    }

    93%{

        opacity:0;

    }

}


/* =========================
   CREATOR
   PAINT BRUSH STYLE
========================= */

.creator{

    margin-top:22px;

    font-family:
    'Caveat Brush',
    cursive;

    font-size:

    clamp(
        22px,
        3.5vw,
        36px
    );

    letter-spacing:2px;

    color:#aaa;

    text-transform:none;

    transform:
    rotate(-2deg);

    text-shadow:

    0 0 8px
    rgba(255,255,255,.12),

    0 0 20px
    rgba(255,255,255,.04);

}


/* =========================
   LINE
========================= */

.line{

    width:180px;

    height:1px;

    margin:30px auto;

    background:

    linear-gradient(
        90deg,
        transparent,
        #555,
        transparent
    );

}


/* =========================
   MESSAGE
========================= */

.message{

    margin-top:5px;

    font-family:
    'Orbitron',
    monospace;

    font-size:10px;

    letter-spacing:3px;

    color:#555;

}


.message span{

    color:#888;

}


/* =========================
   ENTER BUTTON
========================= */

.enter{

    display:inline-block;

    padding:16px 32px;

    border:1px solid #383d3d;

    background:
    rgba(0,0,0,.35);

    color:#888;

    text-decoration:none;

    font-family:
    'Orbitron',
    monospace;

    font-size:10px;

    letter-spacing:4px;

    transition:.5s;

    cursor:pointer;

    position:relative;

}


/* OUTER BORDER */

.enter::before{

    content:"";

    position:absolute;

    inset:-7px;

    border:1px solid #222;

    opacity:0;

    transition:.5s;

}


/* HOVER */

.enter:hover{

    color:#eee;

    border-color:#888;

    box-shadow:

    0 0 20px
    rgba(150,160,160,.12),

    inset 0 0 20px
    rgba(150,160,160,.05);

    letter-spacing:6px;

}


.enter:hover::before{

    opacity:1;

}


/* =========================
   CORNER UI
========================= */

.corner{

    position:fixed;

    z-index:6;

    font-family:
    'Orbitron',
    monospace;

    font-size:7px;

    letter-spacing:2px;

    color:#333;

}


.top-left{

    top:25px;

    left:25px;

}


.top-right{

    top:25px;

    right:25px;

}


.bottom-left{

    bottom:25px;

    left:25px;

}


.bottom-right{

    bottom:25px;

    right:25px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .title{

        line-height:1.25;

    }


    .creator{

        font-size:25px;

        letter-spacing:1px;

    }


    .message{

        font-size:8px;

        letter-spacing:2px;

    }


    .enter{

        padding:14px 22px;

    }


    .corner{

        font-size:6px;

    }

}

</style>

</head>


<body>


<!-- FOG -->

<div class="fog"></div>


<!-- PARTICLES -->

<canvas id="particles"></canvas>


<!-- SCANLINES -->

<div class="scanlines"></div>


<!-- VIGNETTE -->

<div class="vignette"></div>


<!-- CORNER SYSTEM -->

<div class="corner top-left">

    SYSTEM: UNKNOWN

</div>


<div class="corner top-right">

    ARCHIVE // 001

</div>


<div class="corner bottom-left">

    CONNECTION: UNSTABLE

</div>


<div class="corner bottom-right">

    00:00:00

</div>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="main">

<div class="content">


    <div class="top-secret">

        █ ACCESS RESTRICTED █

    </div>


    <div class="title">

        THE HIDDEN ARCHIVE

    </div>


    <div class="creator">

        Created by VISHAL TELAM

    </div>


    <div class="line"></div>


    <div class="message">

        SOME THINGS ARE NOT MEANT TO BE FOUND.

    </div>


    <div style="height:35px;"></div>


    <a
        class="enter"
        onclick="enterArchive()"
    >

        ENTER THE ARCHIVE →

    </a>


</div>

</main>


<script>

/* =========================
   PARTICLE SYSTEM
========================= */

const canvas =
document.getElementById(
    "particles"
);

const ctx =
canvas.getContext("2d");

let particles=[];


/* RESIZE */

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* CREATE PARTICLES */

for(
    let i=0;
    i<140;
    i++
){

    particles.push({

        x:
        Math.random()
        *window.innerWidth,

        y:
        Math.random()
        *window.innerHeight,

        size:
        Math.random()
        *1.5+.2,

        speed:
        Math.random()
        *.35+.05,

        opacity:
        Math.random()
        *.45+.05

    });

}


/* ANIMATION */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(p=>{

        p.y -= p.speed;


        if(p.y < 0){

            p.y =
            canvas.height;

            p.x =
            Math.random()
            *canvas.width;

        }


        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
        `rgba(
            180,
            190,
            190,
            ${p.opacity}
        )`;


        ctx.fill();

    });


    requestAnimationFrame(
        animate
    );

}


animate();


/* =========================
   ENTER ARCHIVE
========================= */

function enterArchive(){

    const content =
    document.querySelector(
        ".content"
    );


    content.style.transition =
    "1.2s ease";


    content.style.transform =
    "scale(1.15)";


    content.style.opacity =
    "0";


    content.style.filter =
    "blur(15px)";


    setTimeout(()=>{

        alert(
            "THE ARCHIVE IS WATCHING..."
        );

    },1200);

}

</script>


</body>

    </html>
